<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Boutique | Détail</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="top-bar">
      <button class="icon-btn" id="dark-mode-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <a href="index.html" class="logo">Ma Boutique</a>
      <div class="header-icons">
        <a href="panier.html" class="icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <span class="badge" id="cart-count">0</span>
        </a>
        <a href="wishlist.html" class="icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </a>
      </div>
    </div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="produits.html">Produits</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="panier.html">Panier</a>
    </nav>
  </header>

  <main>
    <div id="product-detail" class="detail-container">
      <!-- Rempli par JS -->
    </div>
  </main>

  <footer>
    <div class="logo">Ma Boutique</div>
    <p>&copy; 2026 Ma Boutique — Tous droits réservés.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      const container = document.getElementById('product-detail');
      const product = products.find(p => p.id === id);

      if (!product) {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><h2>Produit introuvable</h2><a href="produits.html" class="btn btn-solid" style="margin-top:2rem;">Retour aux produits</a></div>`;
        return;
      }

      const wish = getWishlist();
      const isWished = wish.includes(product.id);

      container.innerHTML = `
        <img src="${product.image}" alt="${product.name}" class="detail-img">
        <div class="detail-info">
          <span class="card-category">${product.category}</span>
          <h1>${product.name}</h1>
          <p class="detail-price">${product.price.toLocaleString('fr-FR')} FCFA</p>
          <p class="detail-desc">${product.description}</p>
          
          <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button class="btn btn-solid" id="add-cart-btn" style="flex: 1;">Ajouter au panier</button>
            <button class="btn btn-outline" id="wish-btn" style="flex: 1;">
              ${isWished ? 'Retirer des favoris' : 'Ajouter aux favoris'}
            </button>
          </div>
        </div>
      `;

      document.getElementById('add-cart-btn').addEventListener('click', () => addToCart(product.id));
      
      document.getElementById('wish-btn').addEventListener('click', (e) => {
        addToWishlist(product.id);
        // Mettre à jour le texte du bouton
        const isNowWished = getWishlist().includes(product.id);
        e.target.textContent = isNowWished ? 'Retirer des favoris' : 'Ajouter aux favoris';
      });
    });
  </script>
</body>
</html>
